[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.recorder"

[deploy]
startCommand = "python -m scripts.research.record_microstructure --root /data/microstructure-v1 --include-spot-trades --audit-status-path /data/microstructure-v1/prospective-audits/evidence-gate-status.json"
requiredMountPath = "/data"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
