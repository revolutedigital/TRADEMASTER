[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.recorder"

[deploy]
startCommand = "sh -c 'python -m scripts.research.record_microstructure --root /data/microstructure-v1 --include-spot-trades --audit-status-path /data/microstructure-v1/prospective-audits/evidence-gate-status.json --serve-status-port \"${PORT:-8000}\"'"
requiredMountPath = "/data"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
