openapi: 3.1.0
info:
  title: TradeMaster Asset Intelligence API
  version: 1.3.0
  description: |
    A single-asset workflow for the TradeMaster operator: choose an eligible
    Binance Spot USDT pair, study its market data, train a predictive research
    model, and select a reproducible technical strategy. The workflow never
    activates an engine, arms LIVE execution, or sends an order. A selected
    strategy still needs the existing evidence-gated deployment activation.
servers:
  - url: /api/v1
paths:
  /asset-intelligence/universe:
    get:
      operationId: listEligibleSpotAssets
      summary: List liquid, tradeable Binance Spot USDT assets.
      description: |
        Returns pairs reported as TRADING and SPOT-capable by Binance. Stable
        quote-like base assets and pairs below the server liquidity floor are
        excluded. Catalog data is public market data and is cached server-side;
        exchange credentials are never used or returned.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Eligible assets ordered by 24-hour quote volume.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUniverseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Public Binance market data is temporarily unavailable.
  /asset-intelligence/studies:
    post:
      operationId: createAssetIntelligenceStudy
      summary: Queue a full study for one asset without holding the browser request open.
      description: |
        Queues (or returns) the current durable study job for the requested
        eligible asset. The full research can take longer than an HTTP gateway
        allows because it loads public OHLCV history, trains the model, runs
        the backtest, and completes the walk-forward evidence. Poll the job
        URL until it is COMPLETED, FAILED, or INTERRUPTED. The study itself
        loads public OHLCV history,
        derives market-regime, candle-flow, and liquidity evidence; trains and
        validates a research-only predictive model; and evaluates a bounded,
        explainable pattern library (trend continuation, compression breakout,
        and range reversion). Candidate selection uses only the earlier
        selection history. The later holdout block is separated by a five-candle
        embargo and is used exclusively by the walk-forward deployment gate.
        The model must clear a balanced-accuracy floor and must not signal SELL
        before a Spot long-only candidate is considered. A weak model, an
        unconfirmed pattern, or a rejected strategy is returned transparently;
        none can trade.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetStudyCreateRequest'
      responses:
        '202':
          description: Study queued, or the active durable study job was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetStudyJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The selected asset is not eligible.
  /asset-intelligence/studies/{study_id}:
    get:
      operationId: getAssetIntelligenceStudy
      summary: Read full-study progress and result.
      security:
        - bearerAuth: []
      parameters:
        - name: study_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Current or completed durable study result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetStudyJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Study job does not exist.
  /asset-intelligence/opportunity-scans:
    post:
      operationId: startMarketOpportunityScan
      summary: Scan the whole eligible Spot universe for research candidates.
      description: |
        Starts (or returns the current) asynchronous market scan. Every asset
        in the current eligible Spot USDT catalog is screened from public
        market data; only the six highest-scoring candidates receive the
        slower full predictive-model, backtest, and walk-forward study. The
        screening rank is not a buy signal or a performance promise. This
        endpoint never activates a deployment, starts the trading engine,
        arms LIVE execution, or sends an order.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: A scan was started, or the existing active scan was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOpportunityScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Public Binance market data is temporarily unavailable.
  /asset-intelligence/opportunity-scans/{scan_id}:
    get:
      operationId: getMarketOpportunityScan
      summary: Read market-scan progress and finalists.
      security:
        - bearerAuth: []
      parameters:
        - name: scan_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Current or completed market-scan evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOpportunityScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Scan does not exist.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication is required.
  schemas:
    AssetStudyCreateRequest:
      type: object
      additionalProperties: false
      required: [symbol]
      properties:
        symbol:
          type: string
          pattern: '^[A-Z0-9]{5,20}$'
          description: Binance Spot pair chosen from the eligible universe.
    AssetUniverseItem:
      type: object
      additionalProperties: false
      required: [symbol, base_asset, quote_asset, quote_volume_24h, price_change_pct_24h]
      properties:
        symbol:
          type: string
        base_asset:
          type: string
        quote_asset:
          type: string
          const: USDT
        quote_volume_24h:
          type: number
        price_change_pct_24h:
          type: number
    AssetUniverseResponse:
      type: object
      additionalProperties: false
      required: [assets, generated_at, minimum_quote_volume_24h]
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetUniverseItem'
        generated_at:
          type: string
          format: date-time
        minimum_quote_volume_24h:
          type: number
    AssetStudy:
      type: object
      additionalProperties: false
      required:
        - symbol
        - execution_mode
        - market_study
        - pattern_study
        - predictive_model
        - recommendation
      properties:
        symbol:
          type: string
        execution_mode:
          type: string
          enum: [PAPER, TESTNET, LIVE]
        market_study:
          type: object
          required: [trend, volatility_pct, liquidity_quote_volume_24h, candles]
          properties:
            trend:
              type: string
              enum: [UPTREND, DOWNTREND, RANGE]
            volatility_pct:
              type: number
            liquidity_quote_volume_24h:
              type: number
            candles:
              type: integer
        pattern_study:
          type: object
          additionalProperties: false
          required:
            - regime
            - pattern
            - confidence
            - relative_volume
            - taker_buy_imbalance
            - flow_data_available
            - explanation
          properties:
            regime:
              type: string
              enum: [UPTREND, DOWNTREND, RANGE, COMPRESSION, STRESS]
            pattern:
              type: string
              enum: [TREND_CONTINUATION, COMPRESSION_BREAKOUT, MEAN_REVERSION, OBSERVATION_ONLY]
            confidence:
              type: number
              minimum: 0
              maximum: 1
            relative_volume:
              type: number
              description: Current quote-volume divided by the robust recent median.
            taker_buy_imbalance:
              type: [number, 'null']
              minimum: -1
              maximum: 1
              description: Aggressor-buy imbalance from closed-candle taker-buy quote volume.
            flow_data_available:
              type: boolean
            explanation:
              type: string
        predictive_model:
          type: object
          required: [model_type, trained, validation_accuracy, samples, latest_signal]
          properties:
            model_type:
              type: string
              const: xgboost
            trained:
              type: boolean
            validation_accuracy:
              type: [number, 'null']
              description: Held-out balanced accuracy across BUY, HOLD, and SELL classes.
            samples:
              type: integer
            latest_signal:
              type: string
              enum: [BUY, HOLD, SELL, UNAVAILABLE]
        recommendation:
          type: object
          required: [strategy_name, backtest_id, deployment_status, reasons]
          properties:
            strategy_name:
              type: string
            backtest_id:
              type: [integer, 'null']
            deployment_id:
              type: [integer, 'null']
            deployment_status:
              type: string
              enum: [APPROVED, REJECTED, UNAVAILABLE]
            reasons:
              type: array
              items:
                type: string
    AssetStudyJob:
      type: object
      additionalProperties: false
      required:
        - id
        - symbol
        - status
        - message
        - study
        - error_message
        - started_at
        - completed_at
      properties:
        id:
          type: integer
        symbol:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, INTERRUPTED]
        message:
          type: [string, 'null']
        study:
          oneOf:
            - $ref: '#/components/schemas/AssetStudy'
            - type: 'null'
        error_message:
          type: [string, 'null']
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
    MarketOpportunityCandidate:
      type: object
      additionalProperties: false
      required:
        - rank
        - symbol
        - screening_score
        - market_trend
        - price_change_pct_24h
        - quote_volume_24h
        - status
        - study
        - error_message
      properties:
        rank:
          type: integer
          minimum: 1
        symbol:
          type: string
        screening_score:
          type: number
          description: Transparent technical/liquidity screening score, not an expected return.
        market_trend:
          type: string
          enum: [UPTREND, DOWNTREND, RANGE]
        price_change_pct_24h:
          type: number
        quote_volume_24h:
          type: number
        status:
          type: string
          enum: [SHORTLISTED, STUDYING, APPROVED, REJECTED, UNAVAILABLE, FAILED]
        study:
          oneOf:
            - $ref: '#/components/schemas/AssetStudy'
            - type: 'null'
        error_message:
          type: [string, 'null']
    MarketOpportunityScan:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - total_assets
        - screened_assets
        - shortlisted_assets
        - studied_assets
        - failed_assets
        - message
        - candidates
        - started_at
        - completed_at
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, INTERRUPTED]
        total_assets:
          type: integer
          minimum: 0
        screened_assets:
          type: integer
          minimum: 0
        shortlisted_assets:
          type: integer
          minimum: 0
        studied_assets:
          type: integer
          minimum: 0
        failed_assets:
          type: integer
          minimum: 0
        message:
          type: [string, 'null']
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MarketOpportunityCandidate'
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
