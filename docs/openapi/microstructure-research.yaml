        decision_reasons:
          type: array
          items: { type: string }
        metrics:
          type: object
          additionalProperties: true
        artifact_sha256:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        safety:
          $ref: '#/components/schemas/SafetyBoundary'
        generated_at:
          type: string
          format: date-time
