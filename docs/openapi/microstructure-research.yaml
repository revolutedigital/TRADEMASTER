openapi: 3.1.0
info:
  title: TradeMaster Microstructure Research API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Research-only control plane for immutable BTCUSDT microstructure experiments.
    It records experiment configuration, freezes preregistrations, and exposes
    evidence. It never submits an order, activates a strategy, starts a trading
    engine, changes execution mode, arms LIVE, or authorizes TESTNET or LIVE.
servers:
  - url: /api/v1
paths:
  /research/microstructure/evidence-gate:
    get:
      operationId: getMicrostructureEvidenceGate
      summary: Read the prospective book/spot WAL evidence gate artifact.
      description: |
        Returns the last offline WAL audit summary used by the dashboard. The
        endpoint reads a small immutable artifact for the required futures
        `trade`, `depth`, `mark_price`, and spot `spot_trade` WAL streams. It
        never scans raw market data, submits orders, activates strategies, or
        grants execution access.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current book/spot WAL evidence gate status for the research panel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceGateStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /research/microstructure/experiments:
    post:
      operationId: createMicrostructureExperiment
      summary: Create a mutable draft experiment from the bounded v1 protocol.
      description: |
        Creates metadata only. Market outcomes may not be opened until the draft
        has a complete dataset manifest and cost profile and is frozen.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Draft experiment created without starting a research job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The dataset or prospective partition conflicts with burned-data lineage.
    get:
      operationId: listMicrostructureExperiments
      summary: List experiment metadata and evidence status.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExperimentStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Experiments ordered from newest to oldest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /research/microstructure/experiments/{experiment_id}:
    get:
      operationId: getMicrostructureExperiment
      summary: Read one experiment and its immutable lineage identifiers.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Experiment metadata and current research status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /research/microstructure/experiments/{experiment_id}/testnet-eligibility:
    get:
      operationId: getMicrostructureTestnetEligibility
      summary: Read research-to-Testnet metadata without granting execution access.
      description: |
        Crosses the experiment status, the prospective book/spot WAL evidence
        artifact, and the append-only shadow ledger. This endpoint is a release
        checklist only: it never submits orders, activates a strategy, or
        authorizes Testnet or LIVE execution.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Metadata-only Testnet eligibility checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestnetEligibility'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /research/microstructure/experiments/{experiment_id}/testnet-release:
    post:
      operationId: recordMicrostructureResearchTestnetRelease
      summary: Record explicit research Testnet release after all gates pass.
      description: |
        Creates a one-shot research-only release record only after the experiment
        is approved, 60 complete UTC days are present for every required WAL
        stream (`trade`, `depth`, `mark_price`, and `spot_trade`), the
        prospective shadow block is complete and positive, and there are no
        unresolved evidence failures. This record can make the metadata
        checklist eligible, but this endpoint still does not submit orders,
        start Testnet, activate a strategy, or grant execution authorization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordTestnetReleaseRequest'
      responses:
        '201':
          description: Explicit research Testnet release recorded without execution access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchTestnetRelease'
        '200':
          description: Existing release returned idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchTestnetRelease'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Required research gates have not all passed.
  /research/microstructure/experiments/{experiment_id}/partitions/{role}/open:
    post:
      operationId: openMicrostructureResearchPartition
      summary: Irreversibly open one preregistered research partition.
      description: |
        Marks first access to a registered temporal partition. This is research
        lineage only: it grants no execution access and cannot submit or
        schedule an exchange order.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [DEVELOPMENT, TRAINING, SELECTION, AUDIT, PROSPECTIVE_SHADOW]
      responses:
        '200':
          description: Partition opened or returned idempotently if already opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenedResearchPartition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Experiment is not frozen, role is unknown, or data is burned.
  /research/microstructure/experiments/{experiment_id}/shadow-signals:
    post:
      operationId: recordMicrostructureShadowSignal
      summary: Record a hypothetical shadow signal for a frozen experiment.
      description: |
        Appends a model decision to the research-only shadow ledger. The request
        stores a feature-vector hash, not raw feature values, and never submits
        or schedules an exchange order.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordShadowSignalRequest'
      responses:
        '201':
          description: Hypothetical shadow signal recorded without execution access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowSignal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Experiment is not frozen, partition is not open, or signal is invalid.
  /research/microstructure/shadow-signals/{signal_id}/outcome:
    post:
      operationId: recordMicrostructureShadowOutcome
      summary: Attach immutable outcome evidence to one shadow signal.
      description: |
        Records expected/stress net bps for a previously appended hypothetical
        signal only after that signal's full replay horizon has elapsed.
        Outcomes are one-shot evidence and cannot be overwritten. This endpoint
        grants no Testnet or LIVE authority.
      security:
        - bearerAuth: []
      parameters:
        - name: signal_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordShadowOutcomeRequest'
      responses:
        '200':
          description: Shadow outcome recorded as immutable research evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowSignal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Outcome is immature, invalid, or was already recorded.
  /research/microstructure/experiments/{experiment_id}/freeze:
    post:
      operationId: freezeMicrostructureExperiment
      summary: Freeze a complete draft before opening protected outcomes.
      description: |
        Freezing is irreversible. It creates a content hash over the protocol,
        code revision, dataset manifest, cost profile, latency profile, temporal
        partitions, candidate universe, and approval gate. It does not start a
        job and grants no execution permission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Experiment frozen and ready for a separately scheduled offline job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Draft is incomplete, already frozen, or references burned data illegally.
  /research/microstructure/experiments/{experiment_id}/decision:
    post:
      operationId: recordMicrostructureExperimentDecision
      summary: Record the terminal research decision for a frozen experiment.
      description: |
        Stores the gate decision and reasons in the immutable research ledger.
        `APPROVED` decisions require the research-only statistical gate artifact
        emitted by `evaluate_statistical_gate.py`; manual reasons alone can only
        reject or mark a candidate inconclusive. This is metadata only: it does
        not start Testnet, activate a strategy, submit an order, or grant
        execution authorization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordExperimentDecisionRequest'
      responses:
        '200':
          description: Terminal research decision recorded without execution access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Experiment is not frozen or decision payload is invalid.
  /research/microstructure/experiments/{experiment_id}/report:
    get:
      operationId: getMicrostructureExperimentReport
      summary: Read evidence without changing experiment or execution state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Current immutable report and gate decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication is required.
    NotFound:
      description: Experiment does not exist.
  schemas:
    ExperimentStatus:
      type: string
      enum: [DRAFT, FROZEN, REJECTED, INCONCLUSIVE, APPROVED]
    SafetyBoundary:
      type: object
      additionalProperties: false
      required: [research_only, order_submission_allowed, execution_authorization]
      properties:
        research_only:
          type: boolean
          const: true
        order_submission_allowed:
          type: boolean
          const: false
        execution_authorization:
          type: string
          const: none
    ProductContract:
      type: object
      additionalProperties: false
      required:
        - execution_venue
        - execution_product
        - symbol
        - directions
        - auxiliary_signal_venue
        - horizons_seconds
        - position_model
      properties:
        execution_venue:
          type: string
          const: binance_usdm_futures
        execution_product:
          type: string
          const: perpetual
        symbol:
          type: string
          const: BTCUSDT
        directions:
          type: array
          const: [LONG, SHORT]
          items:
            type: string
            enum: [LONG, SHORT]
        auxiliary_signal_venue:
          type: string
          const: binance_spot
        horizons_seconds:
          type: array
          const: [5, 15, 30, 120, 300]
          items:
            type: integer
        position_model:
          type: string
          const: one_net_position
    CostProfile:
      type: object
      additionalProperties: false
      required:
        - maker_fee_bps_per_side
        - taker_fee_bps_per_side
        - expected_slippage_bps_per_side
        - expected_latency_ms
        - stress_roundtrip_bps
        - default_order_style
      properties:
        maker_fee_bps_per_side:
          type: number
          minimum: 0
        taker_fee_bps_per_side:
          type: number
          minimum: 0
        expected_slippage_bps_per_side:
          type: number
          minimum: 0
        expected_latency_ms:
          type: integer
          minimum: 0
        stress_roundtrip_bps:
          type: number
          minimum: 20
          description: Must also be at least twice the complete expected round-trip friction.
        default_order_style:
          type: string
          const: marketable_taker
    DatasetPartition:
      type: object
      additionalProperties: false
      required: [role, start_at, end_at, manifest_sha256]
      properties:
        role:
          type: string
          enum: [DEVELOPMENT, TRAINING, SELECTION, AUDIT, PROSPECTIVE_SHADOW]
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        manifest_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    ApprovalGate:
      type: object
      additionalProperties: false
      required:
        - min_oos_folds
        - min_oos_portfolio_trades
        - min_oos_utc_days
        - adjusted_one_sided_confidence
        - min_expected_cost_lcb_bps
        - min_stress_cost_mean_bps
        - max_probability_backtest_overfitting
        - book_evidence_min_complete_days
        - prospective_shadow_min_days
        - prospective_shadow_max_days
        - top_p_tails_pct
      properties:
        min_oos_folds: { type: integer, const: 3 }
        min_oos_portfolio_trades: { type: integer, const: 200 }
        min_oos_utc_days: { type: integer, const: 20 }
        adjusted_one_sided_confidence: { type: number, const: 0.95 }
        min_expected_cost_lcb_bps: { type: number, exclusiveMinimum: 0 }
        min_stress_cost_mean_bps: { type: number, exclusiveMinimum: 0 }
        max_probability_backtest_overfitting: { type: number, const: 0.2 }
        book_evidence_min_complete_days:
          type: integer
          const: 60
          description: Must be a contiguous sequence of complete UTC WAL-audited days across trade, depth, mark_price, and spot_trade.
        prospective_shadow_min_days: { type: integer, const: 20 }
        prospective_shadow_max_days: { type: integer, const: 30 }
        top_p_tails_pct:
          type: array
          const: [1, 2, 5, 10]
          items: { type: integer }
    BookEvidenceGate:
      type: object
      additionalProperties: false
      required:
        - eligible
        - required_complete_days
        - required_streams
        - audited_days
        - complete_days
        - longest_complete_streak_days
        - streak_start
        - streak_end
        - incomplete_days
        - manifest_sha256
        - reasons
        - safety
      properties:
        eligible:
          type: boolean
        required_complete_days:
          type: integer
          const: 60
        required_streams:
          type: array
          const: [TRADE, DEPTH, MARK_PRICE, SPOT_TRADE]
          items:
            type: string
            enum: [TRADE, DEPTH, MARK_PRICE, SPOT_TRADE]
          description: Required WAL streams for a complete UTC evidence day.
        audited_days:
          type: integer
          minimum: 0
        complete_days:
          type: integer
          minimum: 0
        longest_complete_streak_days:
          type: integer
          minimum: 0
        streak_start:
          type: [string, 'null']
          format: date
        streak_end:
          type: [string, 'null']
          format: date
        incomplete_days:
          type: array
          items:
            type: string
            format: date
        manifest_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        reasons:
          type: array
          items: { type: string }
        safety:
          $ref: '#/components/schemas/SafetyBoundary'
    EvidenceGateStatus:
      type: object
      additionalProperties: false
      required:
        - artifact_available
        - audited_start_date
        - audited_end_date
        - audited_days
        - latest_daily_status
        - latest_daily_manifest_sha256
        - book_evidence_gate
        - status_reasons
        - safety
        - generated_at
      properties:
        artifact_available:
          type: boolean
          description: False means the dashboard is showing an explicit ineligible placeholder.
        audited_start_date:
          type: [string, 'null']
          format: date
        audited_end_date:
          type: [string, 'null']
          format: date
        audited_days:
          type: integer
          minimum: 0
        latest_daily_status:
          type: [string, 'null']
          enum: [VALID, PARTIAL, MISSING, INVALID, null]
        latest_daily_manifest_sha256:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        book_evidence_gate:
          $ref: '#/components/schemas/BookEvidenceGate'
        status_reasons:
          type: array
          items: { type: string }
        safety:
          $ref: '#/components/schemas/SafetyBoundary'
        generated_at:
          type: string
          format: date-time
    TestnetEligibility:
      type: object
      additionalProperties: false
      required:
        - experiment_id
        - experiment_status
        - eligible
        - reasons
        - book_evidence_eligible
        - book_evidence_contiguous_days
        - prospective_shadow_days
        - prospective_shadow_outcome_days
        - prospective_shadow_signal_count
        - prospective_shadow_outcome_signal_count
        - prospective_shadow_expected_mean_bps
        - prospective_shadow_stress_mean_bps
        - prospective_shadow_positive
        - approved_statistical_gate_verified
        - unresolved_failures
        - explicit_testnet_release
        - release_request_required
        - evidence_artifact_available
        - order_submission_allowed
        - execution_authorization
        - safety
        - generated_at
      properties:
        experiment_id:
          type: string
          format: uuid
        experiment_status:
          $ref: '#/components/schemas/ExperimentStatus'
        eligible:
          type: boolean
          description: Metadata-only readiness; still grants no execution access.
        reasons:
          type: array
          items: { type: string }
        book_evidence_eligible:
          type: boolean
          description: True only when the evidence artifact exists and its book/spot WAL gate is eligible.
        book_evidence_contiguous_days:
          type: integer
          minimum: 0
        prospective_shadow_days:
          type: integer
          minimum: 0
        prospective_shadow_outcome_days:
          type: integer
          minimum: 0
        prospective_shadow_signal_count:
          type: integer
          minimum: 0
        prospective_shadow_outcome_signal_count:
          type: integer
          minimum: 0
          description: Counts only mature, immutable replay outcomes with label hash, research-only safety boundary, and no order/execution references.
        prospective_shadow_expected_mean_bps:
          type: [number, 'null']
          description: Mean over counted safe replay outcomes only; null when any outcome is missing or invalid.
        prospective_shadow_stress_mean_bps:
          type: [number, 'null']
          description: Stress mean over counted safe replay outcomes only; null when any outcome is missing or invalid.
        prospective_shadow_positive:
          type: boolean
        approved_statistical_gate_verified:
          type: boolean
          description: True only when the latest APPROVED decision event carries statistical gate hash evidence and research-only safety fields.
        unresolved_failures:
          type: integer
          minimum: 0
        explicit_testnet_release:
          type: boolean
          description: True only after the separate research-only release record is present.
        release_request_required:
          type: boolean
          description: False only after explicit research Testnet release is recorded.
        evidence_artifact_available:
          type: boolean
        order_submission_allowed:
          type: boolean
          const: false
        execution_authorization:
          type: string
          const: none
        safety:
          $ref: '#/components/schemas/SafetyBoundary'
        generated_at:
          type: string
          format: date-time
    RecordTestnetReleaseRequest:
      type: object
      additionalProperties: false
      required:
        - confirmation_phrase
        - reasons
      properties:
        confirmation_phrase:
          type: string
          const: REQUEST RESEARCH TESTNET RELEASE
        reasons:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    ResearchTestnetRelease:
      type: object
      additionalProperties: false
      required:
        - id
        - experiment_id
        - release_sha256
        - requested_by
        - reasons
        - evidence_snapshot
        - released_at
        - explicit_testnet_release
        - release_request_required
        - order_submission_allowed
        - execution_authorization
        - safety
      properties:
        id:
          type: integer
          minimum: 1
        experiment_id:
          type: string
          format: uuid
        release_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        requested_by:
          type: string
        reasons:
          type: array
          items: { type: string }
        evidence_snapshot:
          type: object
          additionalProperties: true
        released_at:
          type: string
          format: date-time
        explicit_testnet_release:
          type: boolean
          const: true
        release_request_required:
          type: boolean
          const: false
        order_submission_allowed:
          type: boolean
          const: false
        execution_authorization:
          type: string
          const: none
        safety:
          $ref: '#/components/schemas/SafetyBoundary'
    OpenedResearchPartition:
      type: object
      additionalProperties: false
      required:
        - id
        - experiment_id
        - role
        - start_at
        - end_at
        - manifest_sha256
        - opened_at
        - safety
      properties:
        id:
          type: integer
          minimum: 1
        experiment_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [DEVELOPMENT, TRAINING, SELECTION, AUDIT, PROSPECTIVE_SHADOW]
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        manifest_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        opened_at:
          type: string
          format: date-time
        safety:
          $ref: '#/components/schemas/SafetyBoundary'
    RecordShadowSignalRequest:
      type: object
      additionalProperties: false
      required:
        - decision_time
        - side
        - horizon_seconds
        - probability
        - threshold
        - model_sha256
        - feature_vector
      properties:
        decision_time:
          type: string
          format: date-time
        side:
          type: string
          enum: [BUY, SELL]
        horizon_seconds:
          type: integer
          enum: [120, 300]
        probability:
          type: number
          minimum: 0
          maximum: 1
        threshold:
          type: number
          minimum: 0
          maximum: 1
        model_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        feature_vector:
          type: object
          additionalProperties:
            type: number
    RecordShadowOutcomeRequest:
      type: object
      description: Records a one-shot research outcome after the signal horizon matures; the server persists recorded_at plus research-only safety fields and never order identifiers.
      additionalProperties: false
      required:
        - expected_net_bps
        - stress_net_bps
        - label_sha256
      properties:
        expected_net_bps:
          type: number
        stress_net_bps:
          type: number
        label_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    RecordExperimentDecisionRequest:
      type: object
      additionalProperties: false
      required:
        - status
        - reasons
      properties:
        status:
          type: string
          enum: [REJECTED, INCONCLUSIVE, APPROVED]
        reasons:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        statistical_gate:
          anyOf:
            - $ref: '#/components/schemas/StatisticalGateEvidence'
            - type: 'null'
          description: Required when status is APPROVED; optional audit evidence for REJECTED or INCONCLUSIVE.
    StatisticalGateEvidence:
      type: object
      additionalProperties: false
      required:
        - research_only
        - order_submission_allowed
        - execution_authorization
        - attempted_hypotheses
        - top_p_monotonic
        - top_p_monotonic_reasons
        - prospective_shadow_positive
        - prospective_shadow_reasons
        - decision_counts
        - results
      properties:
        research_only:
          type: boolean
          const: true
        order_submission_allowed:
          type: boolean
          const: false
        execution_authorization:
          type: string
          const: none
        attempted_hypotheses:
          type: integer
          minimum: 1
        top_p_monotonic:
          type: boolean
          description: Must be true for APPROVED decisions.
        top_p_monotonic_reasons:
          type: array
          items: { type: string }
        prospective_shadow_positive:
          type: boolean
          description: Must be true for APPROVED decisions.
        prospective_shadow_reasons:
          type: array
          items: { type: string }
        decision_counts:
          type: object
          description: Must exactly match the number of APPROVED, REJECTED, and INCONCLUSIVE entries in `results`.
          additionalProperties:
            type: integer
            minimum: 0
        results:
          type: array
          minItems: 1
          description: At least one result with `decision=APPROVED`, the full required condition set present and true, and `adjusted_one_sided_alpha = 0.05 / attempted_hypotheses` is required for APPROVED decisions.
          items:
            type: object
            additionalProperties: true
    ShadowSignal:
      type: object
      additionalProperties: false
      required:
        - id
        - experiment_id
        - decision_time
        - recorded_at
        - side
        - horizon_seconds
        - probability
        - threshold
        - would_enter
        - model_sha256
        - feature_vector_sha256
        - outcome_recorded
        - expected_net_bps
        - stress_net_bps
        - label_sha256
        - safety
      properties:
        id:
          type: integer
          minimum: 1
        experiment_id:
          type: string
          format: uuid
        decision_time:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        side:
          type: string
          enum: [BUY, SELL]
        horizon_seconds:
          type: integer
          enum: [120, 300]
        probability:
          type: number
        threshold:
          type: number
        would_enter:
          type: boolean
        model_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        feature_vector_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        outcome_recorded:
          type: boolean
          description: True only when the stored outcome is a mature research-only replay outcome with finite bps, label SHA-256, and no order/execution reference.
        expected_net_bps:
          type: [number, 'null']
        stress_net_bps:
          type: [number, 'null']
        label_sha256:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        safety:
          $ref: '#/components/schemas/SafetyBoundary'
    CreateExperimentRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - code_revision
        - protocol_sha256
        - product
        - cost_profile
        - dataset_partitions
        - approval_gate
        - hypotheses
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        code_revision:
          type: string
          pattern: '^[a-f0-9]{40}$'
        protocol_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        product:
          $ref: '#/components/schemas/ProductContract'
        cost_profile:
          $ref: '#/components/schemas/CostProfile'
        dataset_partitions:
          type: array
          minItems: 4
          maxItems: 5
          items:
            $ref: '#/components/schemas/DatasetPartition'
        approval_gate:
          $ref: '#/components/schemas/ApprovalGate'
        hypotheses:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/HypothesisDefinition'
    HypothesisDefinition:
      type: object
      additionalProperties: false
      required: [kind, definition]
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 40
        definition:
          type: object
          additionalProperties: true
    Experiment:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - status
        - code_revision
        - protocol_sha256
        - experiment_sha256
        - product
        - cost_profile
        - dataset_partitions
        - approval_gate
        - safety
        - created_at
        - frozen_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        code_revision:
          type: string
          pattern: '^[a-f0-9]{40}$'
        protocol_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        experiment_sha256:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        product:
          $ref: '#/components/schemas/ProductContract'
        cost_profile:
          $ref: '#/components/schemas/CostProfile'
        dataset_partitions:
          type: array
          items:
            $ref: '#/components/schemas/DatasetPartition'
        approval_gate:
          $ref: '#/components/schemas/ApprovalGate'
        safety:
          $ref: '#/components/schemas/SafetyBoundary'
