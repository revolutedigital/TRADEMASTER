openapi: 3.1.0
info:
  title: TradeMaster Signal Audit API
  version: 1.0.0
  description: |
    Returns the persisted, explainable strategy candidates generated by the
    trading engine. A record is created only after a candidate has passed its
    strategy threshold, multi-timeframe confirmation, and volatility filter.
    `was_executed` distinguishes an actionable pattern from an order that
    actually passed every remaining risk and execution gate. This endpoint is
    read-only and never places, arms, or modifies an order.
servers:
  - url: /api/v1
paths:
  /signals/history:
    get:
      operationId: listSignalHistory
      summary: List recent explainable strategy candidates.
      security:
        - bearerAuth: []
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Z0-9]{5,20}$'
          description: Optional symbol filter, for example BTCUSDT.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Signal candidates, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignalHistoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication is required.
  schemas:
    SignalEvidence:
      type: object
      additionalProperties: false
      required:
        - signal_source
        - signal_threshold
        - agreement_ratio
        - votes
        - regime
        - price
        - atr
        - atr_pct
      properties:
        signal_source:
          type: string
        strategy_deployment_id:
          type: [integer, 'null']
        signal_threshold:
          type: number
        agreement_ratio:
          type: number
        votes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [model, action, score, confidence]
            properties:
              model:
                type: string
              action:
                type: string
                enum: [BUY, HOLD, SELL]
              score:
                type: number
              confidence:
                type: number
        regime:
          type: object
          additionalProperties: false
          required: [market, volatility, confidence, position_size_multiplier]
          properties:
            market:
              type: string
            volatility:
              type: string
            confidence:
              type: number
            position_size_multiplier:
              type: number
        price:
          type: number
        atr:
          type: number
        atr_pct:
          type: number
    SignalHistoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - symbol
        - action
        - strength
        - confidence
        - model_source
        - timeframe
        - was_executed
        - evidence
        - generated_at
      properties:
        id:
          type: integer
        symbol:
          type: string
        action:
          type: string
          enum: [BUY, HOLD, SELL]
        strength:
          type: number
          minimum: -1
          maximum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        model_source:
          type: string
        timeframe:
          type: string
        was_executed:
          type: boolean
        evidence:
          oneOf:
            - $ref: '#/components/schemas/SignalEvidence'
            - type: 'null'
        generated_at:
          type: string
          format: date-time
