openapi: 3.1.0
info:
  title: TradeMaster Strategy Research API
  version: 1.0.0
  description: |
    Research-only API for deterministic technical-strategy backtests. A result
    is historical analysis, not a recommendation or authorization to trade.
    Signals generated from a completed candle execute no earlier than the next
    candle open, with configured slippage and fees applied.
servers:
  - url: /api/v1
paths:
  /backtest/run:
    post:
      operationId: runBacktest
      summary: Run a historical backtest for ML signals or a selected technical strategy.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: Historical backtest metrics and the exact strategy evaluated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /backtest/walk-forward:
    post:
      operationId: runWalkForwardValidation
      summary: Validate a strategy in rolling out-of-sample windows at the requested interval.
      description: |
        The train, test, and step windows are converted to candles using the
        requested interval. Completed-candle signals execute on the following
        candle open, never on the candle that generated them. It is research
        evidence only and never activates a strategy or authorizes a trade.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: Aggregated out-of-sample metrics and individual windows.
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication is required.
  schemas:
    BacktestRequest:
      type: object
      additionalProperties: false
      properties:
        symbol:
          type: string
          pattern: '^[A-Z]{3,10}USDT$'
          default: BTCUSDT
        interval:
          type: string
          enum: [1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w]
          default: 1h
        initial_capital:
          type: number
          minimum: 100
          maximum: 1000000
          default: 10000
        signal_threshold:
          type: number
          minimum: 0.1
          maximum: 0.9
          default: 0.3
        atr_stop_multiplier:
          type: number
          minimum: 0.5
          maximum: 5
          default: 2
        risk_reward_ratio:
          type: number
          minimum: 0.5
          maximum: 10
          default: 2
        strategy:
          $ref: '#/components/schemas/TechnicalStrategyConfig'
    TechnicalStrategyConfig:
      type: object
      additionalProperties: false
      required: [kind, indicators]
      properties:
        kind:
          type: string
          const: technical_ensemble
        indicators:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: string
            enum: [sma, ema, rsi, macd, bollinger, engulfing, breakout]
        indicator_params:
          type: object
          description: |
            Optional per-indicator settings. `engulfing` accepts no parameters.
            `breakout.breakout_lookback` must be an integer from 5 to 200.
          additionalProperties:
            type: object
            additionalProperties:
              type: number
        min_confirmations:
          type: integer
          minimum: 1
          maximum: 7
          default: 1
        execution_profile:
          type: string
          const: spot_long_only
          description: SELL signals close a long position; they never open a short position.
    BacktestResponse:
      type: object
      required:
        - id
        - total_return
        - total_return_pct
        - total_trades
        - winning_trades
        - losing_trades
        - win_rate
        - sharpe_ratio
        - max_drawdown
        - max_drawdown_pct
        - profit_factor
        - expectancy
        - equity_curve
      properties:
        id:
          type: [integer, 'null']
          description: Persisted result identifier. Null only when no historical data was available.
        total_return: { type: number }
        total_return_pct: { type: number }
        total_trades: { type: integer }
        winning_trades: { type: integer }
        losing_trades: { type: integer }
        win_rate: { type: number }
        sharpe_ratio: { type: number }
        max_drawdown: { type: number }
        max_drawdown_pct: { type: number }
        profit_factor: { type: number }
        expectancy: { type: number }
        equity_curve:
          type: array
          items: { type: number }
        strategy:
          $ref: '#/components/schemas/StrategySummary'
    StrategySummary:
      type: object
      required: [name, execution_profile, research_only]
      properties:
        name: { type: string }
        execution_profile: { type: string, enum: [spot_long_only, model_long_short] }
        research_only: { type: boolean, const: true }
        indicators:
          type: array
          items: { type: string }
        min_confirmations: { type: integer }
